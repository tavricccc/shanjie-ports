# The Windows build: its own workspace, nothing shared with the Linux build except the shell and core path crates.
#   proto  the TSF DLL <-> host protocol (std only; its tests run anywhere)
#   host   shanjie-host.exe: the one process that owns the shell and the engine, and draws the candidate window
#   tsf    shanjie_tsf.dll: the thin text service loaded into every app
# UNVERIFIED ON WINDOWS: built by cross compilation (x86_64-pc-windows-gnu) only; see README.md.
[workspace]
resolver = "2"
members = ["proto", "host", "tsf"]

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false

[workspace.dependencies]
windows = { version = "0.62.2", features = [
  "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security", "Win32_Security_Authorization",
  "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_IO", "Win32_System_LibraryLoader",
  "Win32_System_Ole", "Win32_System_Pipes", "Win32_System_ProcessStatus", "Win32_System_Registry",
  "Win32_System_Threading", "Win32_System_Variant", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_TextServices", "Win32_UI_WindowsAndMessaging",
] }
windows-core = "0.62.2"

[profile.release]
debug = false
