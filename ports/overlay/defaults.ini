# Overlay defaults shared by every port. EMPTY ON PURPOSE: the ports ship upstream's behavior.
#
# What a line here does: it changes what a setting means while the user has never chosen it (Shell.swift's `?? value`
# at each read). A value the user saved always wins; nothing here is ever written to the user's settings. An empty file
# is exactly upstream.
#
# Format: key=value, one per line; blank lines and # comments are skipped. Merged at packaging with linux.ini or
# windows.ini (ports/overlay/merge.sh): a key set in the platform file replaces the one here.
#
# Keys (the macOS app's UserDefaults keys; upstream's value in brackets):
#   layout=standard|eten                          [standard]
#   demoteSensitive=true|false                    [true]
#   prediction=true|false                         [true]
#   abbreviation=true|false                       [false; the menu entry is hidden, as on macOS]
#   english=true|false                            [true]
#   englishInline=true|false                      [true]  true: 打字時就顯示, false: 按空白才顯示
#   cjkSpacing=true|false                         [false] 中英文之間自動加空格
#   acgPack=true|false                            [true]
#   glassTint=0..1                                [0; macOS only, stored and unused by the ports]
#   candidateVertical=true|false                  [false]
#   rerank=true|false                             [true]
#   rerankLevel=conservative|standard|aggressive  [standard]
#   profileMode=auto|chat|formal                  [auto]
#
# The Windows habits (ports/docs/windows-habits.md), the shell's own settings: win.* switches true|false, all at
# upstream's behavior when absent, e.g.
#   win.shiftToggle=true|false                    [false] 單按 Shift 切換中／英
#   win.shiftSide=both|left|right                 [both]
#   win.mixedInput=true|false                     [false] Windows 注音順序混打
#   win.punct.shift.comma=true|false              [true]  Shift＋, 打出「，」
# The full list is the `known` keys of merge.sh.
